version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: scraper_db
    restart: always
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: troque_essa_senha
      POSTGRES_DB: scraper_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: scraper_api
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  postgres_data:
